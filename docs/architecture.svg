<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" role="img" aria-label="The page asks FastAPI; the router picks one to three of three agents or asks a clarifying question; agents call read-only catalog tools through an MCP server, which other MCP clients can also call; input guardrails check the question, redact names and state the instruction hierarchy; output guardrails check each draft before the answer is shown. Only redacted text reaches the LLM and the Phoenix traces. Users rate answers thumbs up or down into feedback.db. Ingestion builds the catalog, and an offline evaluation pipeline runs the same agents and scores them with code; the dashboard shows eval metrics next to user feedback.">
  <style>
  svg { --bg: #ffffff; --fg: #1b2330; --muted: #5a6575; --line: #c3cad5; --panel: #ffffff;
        --llm-fill: #f0ebfb; --llm-stroke: #7457c4; --code-fill: #e5f3ee; --code-stroke: #2b7a63;
        --rag-fill: #fdf0d8; --rag-stroke: #b06f12;
        --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: var(--muted); }
  @media (prefers-color-scheme: dark) {
    svg { --bg: #0d1117; --fg: #e2e7ee; --muted: #9ba6b5; --line: #3a4452; --panel: #161b22;
          --llm-fill: #29213f; --llm-stroke: #a68ef0; --code-fill: #16302a; --code-stroke: #5cc2a3;
          --rag-fill: #3a2b12; --rag-stroke: #e3a64a; }
  }
  .bg { fill: var(--bg); }

  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .llm { fill: var(--llm-fill); stroke: var(--llm-stroke); stroke-width: 1.4; }
  .code { fill: var(--code-fill); stroke: var(--code-stroke); stroke-width: 1.4; }
  .guard { fill: var(--code-fill); stroke: var(--code-stroke); stroke-width: 2.6; }
  .rag { fill: var(--rag-fill); stroke: var(--rag-stroke); stroke-width: 1.4; }
  .pill { font: 500 10.5px var(--sans); fill: var(--fg); }
  .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .boundary { stroke: var(--llm-stroke); stroke-width: 1.4; stroke-dasharray: 8 5; fill: none; }
  .ln { stroke: currentColor; stroke-width: 1.4; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .t { fill: var(--fg); font: 500 14px var(--sans); }
  .s { fill: var(--fg); font: 400 12px var(--sans); }
  .m { fill: var(--muted); font: 400 11.5px var(--sans); }
  .mono { fill: var(--fg); font: 400 11.5px var(--mono); }
  .lab { fill: var(--muted); font: 400 11.5px var(--sans); }
  .cap { fill: var(--muted); font: 500 11px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; }
  .vio { fill: var(--llm-stroke); }

  /* larger for a README column, where the figure shows at 65-75% */
  .t { font-size: 15.5px; font-weight: 600; } .s { font-size: 13px; } .m, .lab, .mono { font-size: 12.5px; }
  .cap { font-size: 12px; } .pill { font-size: 11.5px; } .mono.tl { font-size: 11.5px; }
  </style>
  <rect width="1300" height="860" rx="10" class="bg"/>
          <defs><marker id="a1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
          <rect x="16" y="14" width="16" height="12" rx="2" class="llm"/>
          <text x="40" y="24" class="s">calls the LLM</text>
          <rect x="16" y="36" width="16" height="12" rx="2" class="code"/>
          <text x="40" y="46" class="s">code only</text>
          <rect x="16" y="58" width="16" height="12" rx="2" class="guard"/>
          <text x="40" y="68" class="s">security control</text>

          <rect x="400" y="20" width="440" height="56" rx="6" class="llm"/>
          <text x="620" y="44" text-anchor="middle" class="t">LLM provider</text>
          <text x="620" y="64" text-anchor="middle" class="m">hosted LLM API</text>

          <polyline points="870,92 870,48 936,48" class="ln" marker-end="url(#a1)"/>
          <rect x="940" y="20" width="344" height="56" rx="6" class="box"/>
          <text x="1112" y="44" text-anchor="middle" class="t">Phoenix traces</text>
          <text x="1112" y="64" text-anchor="middle" class="m">OpenTelemetry · LLM, tool and guardrail spans</text>

          <line x1="449" y1="80" x2="449" y2="216" class="ln" marker-start="url(#a1)" marker-end="url(#a1)"/>
          <line x1="701" y1="80" x2="701" y2="124" class="ln" marker-start="url(#a1)" marker-end="url(#a1)"/>
