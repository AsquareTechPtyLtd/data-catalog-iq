          <text x="16" y="100" class="cap vio">outside</text>
          <text x="16" y="128" class="cap">inside</text>
          <rect x="400" y="92" width="500" height="32" rx="6" class="guard"/>
          <text x="650" y="113" text-anchor="middle" class="s"><tspan font-weight="600">Input guardrails</tspan>: question check · redaction · instruction hierarchy</text>

          <rect x="16" y="230" width="110" height="60" rx="6" class="box"/>
          <text x="71" y="265" text-anchor="middle" class="t">Web page</text>
          <line x1="126" y1="260" x2="176" y2="260" class="ln" marker-end="url(#a1)"/>

          <rect x="180" y="220" width="140" height="80" rx="6" class="code"/>
          <text x="250" y="254" text-anchor="middle" class="t">FastAPI</text>
          <text x="250" y="276" text-anchor="middle" class="m">streams answers</text>
          <line x1="320" y1="260" x2="370" y2="260" class="ln" marker-end="url(#a1)"/>

          <rect x="374" y="220" width="150" height="80" rx="6" class="llm"/>
          <text x="449" y="254" text-anchor="middle" class="t">Router</text>
          <text x="449" y="276" text-anchor="middle" class="m">3 samples must agree</text>

          <line x1="449" y1="300" x2="449" y2="346" class="ln" marker-end="url(#a1)"/>
          <text x="441" y="328" text-anchor="end" class="lab">table unclear</text>
          <rect x="374" y="350" width="150" height="56" rx="6" class="box"/>
          <text x="449" y="383" text-anchor="middle" class="t">Clarifying question</text>

          <line x1="524" y1="260" x2="550" y2="260" class="ln"/>
          <line x1="550" y1="170" x2="550" y2="350" class="ln"/>
          <line x1="550" y1="170" x2="578" y2="170" class="ln" marker-end="url(#a1)"/>
          <line x1="550" y1="260" x2="578" y2="260" class="ln" marker-end="url(#a1)"/>
          <line x1="550" y1="350" x2="578" y2="350" class="ln" marker-end="url(#a1)"/>

          <rect x="568" y="128" width="266" height="266" rx="8" class="group"/>

          <rect x="582" y="139" width="240" height="62" rx="6" class="llm"/>
          <text x="594" y="164" class="t">Catalog Lookup</text>
          <text x="594" y="186" class="m">owners, lineage, certification</text>
          <rect x="756" y="175" width="56" height="17" rx="8.5" class="code"/>
          <text x="784" y="187" text-anchor="middle" class="pill">5 tools</text>

          <rect x="582" y="229" width="240" height="62" rx="6" class="llm"/>
          <text x="594" y="254" class="t">PI Classifier</text>
          <text x="594" y="276" class="m">PI per column</text>
          <rect x="760" y="265" width="52" height="17" rx="8.5" class="code"/>
          <text x="786" y="277" text-anchor="middle" class="pill">1 tool</text>

          <rect x="582" y="319" width="240" height="62" rx="6" class="llm"/>
          <text x="594" y="344" class="t">Data Category Recommender</text>
          <text x="594" y="366" class="m">category per table</text>
          <rect x="756" y="355" width="56" height="17" rx="8.5" class="code"/>
          <text x="784" y="367" text-anchor="middle" class="pill">3 tools</text>

          <line x1="822" y1="170" x2="870" y2="170" class="ln" marker-end="url(#a1)"/>
          <line x1="822" y1="260" x2="870" y2="260" class="ln" marker-end="url(#a1)"/>
          <line x1="822" y1="350" x2="870" y2="350" class="ln" marker-end="url(#a1)"/>
          <text x="846" y="162" text-anchor="middle" class="lab">draft</text>

          <rect x="874" y="139" width="170" height="242" rx="6" class="guard"/>
          <text x="959" y="163" text-anchor="middle" class="t">Output guardrails</text>
          <text x="888" y="202" class="cap">every answer</text>
          <text x="888" y="222" class="s">· citations are real</text>
          <text x="888" y="240" class="s">· claims match sources</text>
          <text x="888" y="258" class="s">· tables came from tools</text>
          <text x="888" y="300" class="cap">on failure</text>
          <text x="888" y="320" class="s">· retry once, then refuse</text>

          <line x1="1044" y1="260" x2="1094" y2="260" class="ln" marker-end="url(#a1)"/>
          <rect x="1098" y="222" width="186" height="76" rx="6" class="box"/>
          <text x="1191" y="254" text-anchor="middle" class="t">Answer</text>
          <text x="1191" y="276" text-anchor="middle" class="m">cited, with evidence level</text>

          <line x1="1191" y1="298" x2="1191" y2="388" class="ln" marker-end="url(#a1)"/>
          <text x="1183" y="340" text-anchor="end" class="lab">👍 / 👎 rating</text>
          <text x="1183" y="356" text-anchor="end" class="lab">no text kept</text>
          <path d="M1131,402 v40 a60,10 0 0 0 120,0 v-40" class="box"/>
          <ellipse cx="1191" cy="402" rx="60" ry="10" class="box"/>
          <text x="1191" y="434" text-anchor="middle" class="t">feedback.db</text>
          <line x1="1191" y1="452" x2="1191" y2="754" class="ln" marker-end="url(#a1)"/>

          <line x1="701" y1="394" x2="701" y2="420" class="ln" marker-end="url(#a1)"/>
          <text x="709" y="412" class="lab">MCP tool calls</text>
          <rect x="360" y="424" width="696" height="138" rx="6" class="guard"/>
          <text x="374" y="447" class="t">MCP server</text>
          <text x="474" y="447" class="m">9 read-only catalog tools, each callable on its own</text>
          <text x="374" y="471" class="s" font-weight="600">Catalog Lookup</text>
          <text x="490" y="471" class="mono tl">find_table · get_table · get_lineage · trace_path · filter_tables</text>
          <text x="374" y="490" class="s" font-weight="600">PI Classifier</text>
          <text x="490" y="490" class="mono tl">get_columns</text>
          <text x="374" y="509" class="s" font-weight="600">Data Category</text>
          <text x="490" y="509" class="mono tl">get_data_category_evidence · <tspan fill="var(--rag-stroke)" font-weight="500">search_data_categories</tspan> · get_data_category</text>
          <text x="374" y="530" class="s"><tspan font-weight="600" fill="var(--rag-stroke)">Hybrid RAG + re-ranker</tspan> in search_data_categories: BM25 + embeddings, RRF merge, cross-encoder re-rank</text>
          <text x="374" y="551" class="m">every call: allow-list · arguments · size<tspan dx="22">outside callers also: rate limit · entitlements · names → tokens</tspan></text>
          <line x1="701" y1="562" x2="701" y2="604" class="ln" marker-end="url(#a1)"/>
          <rect x="150" y="448" width="180" height="72" rx="6" class="box dash"/>
          <text x="240" y="478" text-anchor="middle" class="t">Other MCP clients</text>
          <text x="240" y="500" text-anchor="middle" class="m">desktop apps · IDEs</text>
