          <text x="140" y="788" text-anchor="middle" class="t">Answer keys</text>
          <text x="140" y="810" text-anchor="middle" class="m">dev + held-out sets</text>
          <line x1="240" y1="793" x2="286" y2="793" class="ln" marker-end="url(#a1)"/>
          <rect x="290" y="758" width="200" height="70" rx="6" class="code"/>
          <text x="390" y="788" text-anchor="middle" class="t">Eval runner</text>
