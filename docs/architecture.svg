          <rect x="804" y="624" width="130" height="40" rx="6" class="box"/>
          <text x="869" y="648" text-anchor="middle" class="m">rollback copy</text>

          <rect x="180" y="614" width="170" height="60" rx="6" class="box"/>
          <text x="265" y="640" text-anchor="middle" class="t">Sources</text>
          <text x="265" y="660" text-anchor="middle" class="m">Collibra · ODCS · dbt</text>
          <line x1="350" y1="644" x2="396" y2="644" class="ln" marker-end="url(#a1)"/>
          <rect x="400" y="614" width="170" height="60" rx="6" class="code"/>
          <text x="485" y="640" text-anchor="middle" class="t">Ingestion</text>
          <text x="485" y="660" text-anchor="middle" class="m">checked before publish</text>
          <line x1="570" y1="644" x2="637" y2="644" class="ln" marker-end="url(#a1)"/>

