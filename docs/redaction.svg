<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290" role="img" aria-label="Redaction replaces Maya Okafor with PERSON_3f9a2c1b before text goes to the LLM, and restores the real name in the reply before the page shows it.">
  <style>
  svg { --bg: #ffffff; --fg: #1b2330; --muted: #5a6575; --line: #c3cad5; --panel: #ffffff;
        --llm-fill: #f0ebfb; --llm-stroke: #7457c4; --code-fill: #e5f3ee; --code-stroke: #2b7a63;
        --rag-fill: #fdf0d8; --rag-stroke: #b06f12;
        --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: var(--muted); }
  @media (prefers-color-scheme: dark) {
    svg { --bg: #0d1117; --fg: #e2e7ee; --muted: #9ba6b5; --line: #3a4452; --panel: #161b22;
          --llm-fill: #29213f; --llm-stroke: #a68ef0; --code-fill: #16302a; --code-stroke: #5cc2a3;
          --rag-fill: #3a2b12; --rag-stroke: #e3a64a; }
  }
  .bg { fill: var(--bg); }

  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .llm { fill: var(--llm-fill); stroke: var(--llm-stroke); stroke-width: 1.4; }
  .code { fill: var(--code-fill); stroke: var(--code-stroke); stroke-width: 1.4; }
  .guard { fill: var(--code-fill); stroke: var(--code-stroke); stroke-width: 2.6; }
  .rag { fill: var(--rag-fill); stroke: var(--rag-stroke); stroke-width: 1.4; }
  .pill { font: 500 10.5px var(--sans); fill: var(--fg); }
  .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .boundary { stroke: var(--llm-stroke); stroke-width: 1.4; stroke-dasharray: 8 5; fill: none; }
  .ln { stroke: currentColor; stroke-width: 1.4; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .t { fill: var(--fg); font: 500 14px var(--sans); }
  .s { fill: var(--fg); font: 400 12px var(--sans); }
  .m { fill: var(--muted); font: 400 11.5px var(--sans); }
  .mono { fill: var(--fg); font: 400 11.5px var(--mono); }
  .lab { fill: var(--muted); font: 400 11.5px var(--sans); }
  .cap { fill: var(--muted); font: 500 11px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; }
  .vio { fill: var(--llm-stroke); }

  /* larger for a README column, where the figure shows at 65-75% */
  .t { font-size: 15.5px; font-weight: 600; } .s { font-size: 13px; } .m, .lab, .mono { font-size: 12.5px; }
  .cap { font-size: 12px; } .pill { font-size: 11.5px; }
  </style>
  <rect width="1100" height="290" rx="10" class="bg"/>
          <defs><marker id="a0" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
          <line x1="717" y1="14" x2="717" y2="282" class="boundary"/>
          <text x="705" y="22" text-anchor="end" class="cap">inside</text>
          <text x="729" y="22" class="cap vio">outside</text>

          <rect x="16" y="50" width="300" height="64" rx="6" class="box"/>
          <text x="28" y="76" class="t">Tool result</text>
          <text x="28" y="98" class="mono">owner: Maya Okafor</text>
          <line x1="316" y1="82" x2="406" y2="82" class="ln" marker-end="url(#a0)"/>

          <rect x="410" y="34" width="280" height="226" rx="6" class="guard"/>
          <text x="550" y="58" text-anchor="middle" class="t">Redaction (code)</text>
          <text x="550" y="90" text-anchor="middle" class="mono">Maya Okafor → PERSON_3f9a2c1b</text>
          <text x="550" y="146" text-anchor="middle" class="m">new key every request</text>
          <text x="550" y="216" text-anchor="middle" class="mono">PERSON_3f9a2c1b → Maya Okafor</text>

          <line x1="690" y1="82" x2="740" y2="82" class="ln" marker-end="url(#a0)"/>
          <rect x="744" y="50" width="340" height="64" rx="6" class="llm"/>
          <text x="756" y="76" class="t">What the LLM sees</text>
          <text x="756" y="98" class="mono">owner: PERSON_3f9a2c1b</text>

          <rect x="744" y="180" width="340" height="64" rx="6" class="llm"/>
          <text x="756" y="206" class="t">LLM reply</text>
          <text x="756" y="228" class="mono">owned by PERSON_3f9a2c1b</text>
          <line x1="744" y1="212" x2="694" y2="212" class="ln" marker-end="url(#a0)"/>

          <line x1="410" y1="212" x2="320" y2="212" class="ln" marker-end="url(#a0)"/>
          <rect x="16" y="180" width="300" height="64" rx="6" class="box"/>
          <text x="28" y="206" class="t">Page shows</text>
          <text x="28" y="228" class="mono">owned by Maya Okafor</text>
        </svg>
