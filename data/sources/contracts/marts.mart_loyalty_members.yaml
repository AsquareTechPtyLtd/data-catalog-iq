# Synthetic data contract for the fictional company Fernwood Outfitters.
# ODCS-style (Open Data Contract Standard v3).
apiVersion: v3.0.0
kind: DataContract
id: contract_marts__mart_loyalty_members
name: mart_loyalty_members
version: 2.3.2
status: active
domain: customer
dataProduct: Customer 360
description:
  purpose: Loyalty program members with tier and in-store spend.
  usage: Governed mart for reporting and downstream data products.
team:
- username: maya.okafor@fernwood.example
  name: Maya Okafor
  role: Owner
- username: daniel.reyes@fernwood.example
  name: Daniel Reyes
  role: Analytics Engineer
support:
- channel: '#customer-data-support'
  tool: slack
  scope: issues
- channel: customer-data@fernwood.example
  tool: email
  scope: questions
slaProperties:
- property: freshness
  value: 24
  unit: h
- property: frequency
  value: daily
schema:
- name: mart_loyalty_members
  physicalName: fernwood_dw.marts.mart_loyalty_members
  physicalType: table
  description: Loyalty program members with tier and in-store spend.
  properties:
  - name: customer_id
    logicalType: string
    physicalType: TEXT
    description: Customer
    primaryKey: true
    required: true
  - name: email
    logicalType: string
    physicalType: TEXT
    description: Email
  - name: full_name
    logicalType: string
    physicalType: TEXT
    description: Full name
  - name: date_of_birth
    logicalType: string
    physicalType: TEXT
    description: Date of birth
  - name: loyalty_tier
    logicalType: string
    physicalType: TEXT
    description: Loyalty tier
  - name: loyalty_joined_at
    logicalType: string
    physicalType: TEXT
    description: Enrolment date
  - name: in_store_spend_usd
    logicalType: number
    physicalType: REAL
    description: 12-month in-store spend
  - name: points_balance
    logicalType: integer
    physicalType: INTEGER
    required: true
    description: Current loyalty points balance.
quality:
- rule: unique
  columns:
  - customer_id
  description: Primary key is unique.
- rule: notNull
  columns:
  - customer_id
  description: Primary key is never null.
