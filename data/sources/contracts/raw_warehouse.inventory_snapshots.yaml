# Synthetic data contract for the fictional company Fernwood Outfitters.
# ODCS-style (Open Data Contract Standard v3).
apiVersion: v3.0.0
kind: DataContract
id: contract_raw_warehouse__inventory_snapshots
name: inventory_snapshots
version: 1.2.2
status: active
domain: supply_chain
dataProduct: 'Source: warehouse'
description:
  purpose: Weekly stock-on-hand snapshots by warehouse.
  usage: Source data as landed from the operational system; consume via staging models.
team:
- username: lucia.ferraro@fernwood.example
  name: Lucia Ferraro
  role: Owner
- username: samuel.adeyemi@fernwood.example
  name: Samuel Adeyemi
  role: Owner
support:
- channel: '#supply-chain-data'
  tool: slack
  scope: issues
- channel: supply-chain-analytics@fernwood.example
  tool: email
  scope: questions
slaProperties:
- property: freshness
  value: 24
  unit: h
- property: frequency
  value: daily
schema:
- name: inventory_snapshots
  physicalName: fernwood_dw.raw_warehouse.inventory_snapshots
  physicalType: table
  description: Weekly stock-on-hand snapshots by warehouse.
  properties:
  - name: snapshot_id
    logicalType: string
    physicalType: TEXT
    description: Snapshot row identifier
    primaryKey: true
    required: true
  - name: snapshot_date
    logicalType: string
    physicalType: TEXT
    description: Snapshot date
  - name: sku
    logicalType: string
    physicalType: TEXT
    description: Stock keeping unit
  - name: warehouse_id
    logicalType: string
    physicalType: TEXT
    description: Warehouse code (e.g. WH-RENO)
  - name: on_hand_qty
    logicalType: integer
    physicalType: INTEGER
    description: Units on hand
quality:
- rule: unique
  columns:
  - snapshot_id
  description: Primary key is unique.
- rule: notNull
  columns:
  - snapshot_id
  description: Primary key is never null.
