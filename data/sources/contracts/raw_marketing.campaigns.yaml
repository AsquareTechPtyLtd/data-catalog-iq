    logicalType: string
    physicalType: TEXT
    description: email / paid_social / search
  - name: start_date
    logicalType: string
    physicalType: TEXT
    description: Campaign start
  - name: end_date
    logicalType: string
    physicalType: TEXT
    description: Campaign end
  - name: budget_usd
    logicalType: number
    physicalType: REAL
    description: Planned budget
quality:
- rule: unique
  columns:
