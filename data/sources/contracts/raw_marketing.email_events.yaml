# Synthetic data contract for the fictional company Fernwood Outfitters.
# ODCS-style (Open Data Contract Standard v3).
apiVersion: v3.0.0
kind: DataContract
id: contract_raw_marketing__email_events
name: email_events
version: 1.1.2
status: active
domain: marketing
dataProduct: 'Source: marketing'
description:
  purpose: Email campaign delivery and engagement events.
  usage: Source data as landed from the operational system; consume via staging models.
team:
- username: hannah.lindqvist@fernwood.example
  name: Hannah Lindqvist
  role: Owner
- username: samuel.adeyemi@fernwood.example
  name: Samuel Adeyemi
  role: Owner
support:
- channel: '#data-platform-support'
  tool: slack
  scope: issues
- channel: data-platform@fernwood.example
  tool: email
  scope: questions
slaProperties:
- property: freshness
  value: 6
  unit: h
- property: frequency
  value: hourly
schema:
- name: email_events
  physicalName: fernwood_dw.raw_marketing.email_events
  physicalType: table
  description: Email campaign delivery and engagement events.
  properties:
  - name: event_id
    logicalType: string
    physicalType: TEXT
    description: Email event identifier
    primaryKey: true
    required: true
  - name: recipient_email
    logicalType: string
    physicalType: TEXT
    description: Email address the campaign was sent to
  - name: campaign_id
    logicalType: string
    physicalType: TEXT
    description: Campaign
  - name: event_type
    logicalType: string
    physicalType: TEXT
    description: sent / delivered / opened / clicked / bounced
  - name: event_at
    logicalType: string
    physicalType: TEXT
    description: Event timestamp
quality:
- rule: unique
  columns:
  - event_id
  description: Primary key is unique.
- rule: notNull
  columns:
  - event_id
  description: Primary key is never null.
