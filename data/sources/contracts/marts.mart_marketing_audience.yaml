# Synthetic data contract for the fictional company Fernwood Outfitters.
# ODCS-style (Open Data Contract Standard v3).
apiVersion: v3.0.0
kind: DataContract
id: contract_marts__mart_marketing_audience
name: mart_marketing_audience
version: 2.0.0
status: active
domain: marketing
dataProduct: Marketing Insights
description:
  purpose: Opted-in customers with audience segments, synced to the email platform.
  usage: Governed mart for reporting and downstream data products.
team:
- username: hannah.lindqvist@fernwood.example
  name: Hannah Lindqvist
  role: Owner
- username: omar.haddad@fernwood.example
  name: Omar Haddad
  role: Analytics Engineer
support:
