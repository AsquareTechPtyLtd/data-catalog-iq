# Synthetic data contract for the fictional company Fernwood Outfitters.
# ODCS-style (Open Data Contract Standard v3).
apiVersion: v3.0.0
kind: DataContract
id: contract_marts__fct_payments
name: fct_payments
version: 2.3.2
status: active
domain: finance
dataProduct: Finance Reporting
description:
  purpose: One row per payment transaction, including partial card details.
  usage: Governed mart for reporting and downstream data products.
team:
- username: grace.whitfield@fernwood.example
  name: Grace Whitfield
  role: Owner
- username: kenji.mori@fernwood.example
  name: Kenji Mori
  role: Analytics Engineer
support:
- channel: '#finance-data'
  tool: slack
  scope: issues
- channel: finance-data@fernwood.example
  tool: email
  scope: questions
slaProperties:
- property: freshness
  value: 24
  unit: h
- property: frequency
  value: daily
schema:
- name: fct_payments
  physicalName: fernwood_dw.marts.fct_payments
  physicalType: table
  description: One row per payment transaction, including partial card details.
  properties:
  - name: transaction_id
    logicalType: string
    physicalType: TEXT
    description: Transaction identifier
    primaryKey: true
    required: true
  - name: order_id
    logicalType: string
    physicalType: TEXT
    description: Order
  - name: card_last4
    logicalType: string
    physicalType: TEXT
    description: Card last four
  - name: card_brand
    logicalType: string
    physicalType: TEXT
    description: Card brand
  - name: billing_postal_code
    logicalType: string
    physicalType: TEXT
    description: Billing postal code
  - name: amount_usd
    logicalType: number
    physicalType: REAL
    description: Amount
  - name: payment_status
    logicalType: string
    physicalType: TEXT
    description: Status
  - name: processed_at
    logicalType: string
    physicalType: TEXT
    description: Timestamp
quality:
- rule: unique
  columns:
  - transaction_id
  description: Primary key is unique.
- rule: notNull
  columns:
  - transaction_id
  description: Primary key is never null.
