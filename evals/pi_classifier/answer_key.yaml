# PI Classifier answer key: true PI per column (category (subject), or none).
# Generated from the synthetic table blueprint; only the scorer reads it, never the agent.
# open: the open columns (suggested/unclassified) of tables run as is.
# dev / heldout: tables run in blind mode (recorded PI hidden on the table and its neighbours).
tables:
  - table: fernwood_dw.raw_returns.return_requests
    set: open
    columns:
      return_id: none
      order_id: none
      customer_id: none
      contact_email: email (customer)
      reason_text: free_text (customer)
      refund_amount_usd: none
      requested_at: none
    traps:
      contact_email: "unclassified email on an ungoverned table"
      reason_text: "short free text (4.5 words per value)"
  - table: fernwood_dw.raw_helpdesk.tickets
    set: open
    columns:
      subject: none
      body: free_text (customer)
    traps:
      subject: "scanner false positive: template-driven subject line"
      body: "scanner suggestion to confirm"
  - table: fernwood_dw.marts.mart_support_ticket_summary
    set: open
    columns:
      subject: none
      body_excerpt: free_text (customer)
    traps:
      subject: "scanner false positive (copy of tickets.subject)"
      body_excerpt: "scanner suggestion to confirm"
  - table: fernwood_dw.marts.mart_store_performance
    set: open
    columns:
      store_id: none
      sales_date: none
      transactions: none
      sales_usd: none
  - table: fernwood_dw.marts.fct_order_items
