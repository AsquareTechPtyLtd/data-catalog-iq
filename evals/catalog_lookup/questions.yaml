# Answer key for agent 1 (catalog_lookup). Read only by the eval scorer, never
# given to the agent.
#
# Per question:
#   set: dev | negative | heldout
#   expected.status: answered | needs_clarification | insufficient_context | out_of_scope
#   expected.tables: FQNs the response must include (answered only)
#   expected.mentions: each item must appear in the answer or a fact claim
#     (case-insensitive); a list item means "any one of these"
#   expected.escalation: true when the answer must refer to Data Strategy
#   expected.clarification_options: FQNs the clarification must offer
#   expected.relations: lineage links the facts' `relations` must include
#     ({upstream, downstream, kind: direct | indirect})
#   expected.forbidden_tables: FQNs the response must NOT include (filter traps)
#   slices: extra metric groupings (e.g. lineage, filter)
#
# Lineage expectations come from the dbt manifest (depends_on) and the data
# contracts, not from catalog.db, so the eval also checks ingestion.
# Filter expectations come from the contracts (owners), the Collibra export (PI,
# sensitivity), the dbt manifest (consumers) and the table blueprint
# (certification, data category), also not from catalog.db.

questions:
  # --- dev ------------------------------------------------------------------------
